<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeedieX Admin Login</title><link rel="stylesheet" href="/style.css"></head><body class="admin-login"><div class="admin-login-box"><div class="footer-brand">Speedie<span>X</span><small>ADMIN CONTROL CENTER</small></div><h1>Administrator Sign In</h1><p>Manage shipments, tracking events and delivery updates.</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="yellow-btn">Sign in</button><div id="loginError"></div></form></div><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('loginError');m.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(r.ok)location='/admin';else m.textContent=d.error||'Invalid credentials';});</script></body></html>
