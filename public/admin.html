<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeedieX Admin Control Center</title><link rel="stylesheet" href="/style.css"></head><body class="admin-body">
<header class="admin-header"><div class="footer-brand">Speedie<span>X</span><small>ADMIN CONTROL CENTER</small></div><button id="logout" class="admin-logout">Logout</button></header>
<main class="admin-main"><div id="loginCard" hidden></div><div id="dashboard"><div class="adminTop"><div><div class="eyebrow red">CONTROL CENTER</div><h1>Shipment Management</h1><p>Manage customer shipments and live tracking updates.</p></div><button id="newShipment" class="yellow-btn">+ New Shipment</button></div><div class="admin-summary"><div><span>Total Shipments</span><b id="totalStat">—</b></div><div><span>In Transit</span><b id="transitStat">—</b></div><div><span>Delivered</span><b id="deliveredStat">—</b></div><div><span>Pending</span><b id="pendingStat">—</b></div></div><div class="admin-search"><input id="search" placeholder="Search tracking number, recipient or destination"></div><section><h2>Recent Shipments</h2><div id="shipments" class="shipmentGrid"></div></section><div id="editor" class="admin-editor" hidden><div class="admin-editor-head"><h2 id="editorTitle">Shipment</h2><button type="button" id="cancel" class="light">Close</button></div><form id="shipmentForm" class="formGrid"><input name="trackingNumber" placeholder="Tracking number" required><select name="status"><option>Shipment information received</option><option>Picked up by courier</option><option>Departed from origin facility</option><option>In Transit</option><option>Arrived at destination facility</option><option>Customs processing</option><option>Out for delivery</option><option>Delivered</option><option>Exception / Delayed</option></select><input name="origin" placeholder="Origin"><input name="destination" placeholder="Destination"><input name="currentLocation" placeholder="Current location"><input name="service" placeholder="Service type"><input name="parcelType" placeholder="Parcel type"><input name="weight" placeholder="Weight"><input name="reference" placeholder="Reference"><input name="estimatedDelivery" type="date"><input name="senderName" placeholder="Sender name"><input name="senderContact" placeholder="Sender contact"><input name="recipientName" placeholder="Recipient name"><input name="recipientContact" placeholder="Recipient contact"><input name="recipientAddress" placeholder="Recipient address"><div class="actions"><button type="submit" class="yellow-btn">Save Shipment</button></div></form><div id="eventEditor" hidden><hr><h3>Add Tracking Event</h3><form id="eventForm" class="formGrid"><input name="date" type="date" required><input name="time" type="time" required><input name="location" placeholder="Location" required><input name="status" placeholder="Status" required><input name="note" placeholder="Description / note"><button class="yellow-btn">Add Event</button></form></div></div></div></main><script src="/admin.js"></script><script>const oldLoad=window.load;setTimeout(()=>{const s=window.all||[];},200);</script></body></html>
